<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-label="TrailSense AI">
  <title>TrailSense AI</title>
  <!-- Icon: two peaks, snow caps, a dashed trail winding up, and an AI sparkle -->
  <g transform="translate(4 6)">
    <!-- back peak -->
    <path d="M38 78 L64 30 L92 78 Z" fill="#3E8E63"/>
    <path d="M64 30 L71.5 43.5 L66 41 L61 45 L57.2 42.6 Z" fill="#F4F7F5"/>
    <!-- front peak -->
    <path d="M4 78 L36 18 L70 78 Z" fill="#245C43"/>
    <path d="M36 18 L45.2 35.2 L39.5 32 L34 37 L29.5 33.5 L27 35.6 Z" fill="#F4F7F5"/>
    <!-- trail -->
    <path d="M16 78 C 30 70, 50 68, 40 60 S 30 48, 42 44" fill="none" stroke="#F28C28" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 7"/>
    <!-- AI sparkle -->
    <path d="M84 4 C 85.4 11, 87 12.6, 94 14 C 87 15.4, 85.4 17, 84 24 C 82.6 17, 81 15.4, 74 14 C 81 12.6, 82.6 11, 84 4 Z" fill="#F28C28"/>
    <circle cx="96" cy="28" r="2.6" fill="#F28C28"/>
    <!-- ground line -->
    <rect x="0" y="77" width="96" height="4" rx="2" fill="#245C43"/>
  </g>
  <!-- Wordmark -->
  <text x="112" y="62" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#2F7A55">Trail</tspan><tspan fill="#3E8E63">Sense</tspan><tspan fill="#F28C28" dx="8">AI</tspan>
  </text>
</svg>
